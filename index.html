<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Access Finland - Bootcamp Analytics</title>
<!-- PA-TABS-WRAPPER -->
<style>
:root{--gold:#FFD700;--gold-d:#C79A00;--cream:#FFF8E1;--ink:#1f2937;--muted:#6b7280;--line:#f1e3b0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column}
header{background:#fff;border-bottom:3px solid var(--gold);padding:12px 20px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0 0 10px;font-size:1.25rem}
h1 span{color:var(--gold-d)}
nav{display:flex;gap:4px}
nav button{border:0;background:none;cursor:pointer;padding:10px 18px 8px;font:inherit;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;text-align:left}
nav button small{display:block;font-weight:400;font-size:.72rem}
nav button.active{color:var(--ink);border-bottom-color:var(--gold)}
main{flex:1;min-height:0;position:relative}
.panel{display:none;height:100%;overflow:auto}
.panel.active{display:block}
#p1 iframe{width:100%;height:100%;border:0;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:#fff;border-left:5px solid var(--gold);border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.kpi .l{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.kpi .v{font-size:2rem;font-weight:700;color:var(--gold-d)}
.kpi .n{font-size:.8rem;color:#9ca3af}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:16px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:5px solid var(--gold)}
.card h3{margin:0 0 10px;font-size:1.05rem}
.row{display:grid;grid-template-columns:minmax(80px,40%) 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}
.row span{overflow-wrap:anywhere}
.row b{text-align:right}
.bar{background:#f3f4f6;border-radius:6px;height:16px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD700,#f0b400);border-radius:6px}
.empty{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
@media(max-width:600px){header{padding:10px 10px 0}nav button{padding:8px 10px}}
</style>
<style>/*PA-HIDE-NAV*/nav{display:none!important}</style><script>/*PA-STATIC-SHIM*/(function(){
  if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var s=String(u&&u.url?u.url:u),m,t=null;
    if((m=s.match(/\/year\/(\d{4})\/dashboard/))) t='data/year-'+m[1]+'.json';
    else if((m=s.match(/\/range\/dashboard\?start_year=(\d{4})&end_year=(\d{4})/))) t='data/range-'+m[1]+'-'+m[2]+'.json';
    else if(/\/multi-year\/config/.test(s)) t='data/config.json';
    else if(/\/years\/available/.test(s)) t='data/years.json';
    else if((m=s.match(/\/survey\/(\d)(?:\D|$)/))) t='data/survey-'+m[1]+'.json';
    if(!t) return of(u,o);
    return of(t,{cache:'no-store'});
  };
})();</script></head>
<body>
<header>
  <h1>Project Access Finland <span>Bootcamp Analytics</span></h1>
  <nav>
    <button id="t1" class="active" onclick="show(1)">Survey 1<small>Before the bootcamp</small></button>
    <button id="t2" onclick="show(2)">Survey 2<small>During applications</small></button>
    <button id="t3" onclick="show(3)">Survey 3<small>After offers</small></button>
  </nav>
</header>
<main>
  <section id="p1" class="panel active"><iframe src="survey1.html" title="Survey 1"></iframe></section>
  <section id="p2" class="panel"></section>
  <section id="p3" class="panel"></section>
</main>
<script>
var API = (location.hostname === "localhost" || location.hostname === "127.0.0.1") ? "http://localhost:5000" : "https://project-access-pipeline.onrender.com";
var PATHS = ["/api/multi-year/survey/", "/survey/"];
var cache = {};
var STATUS = {no_responses: "No responses yet", in_progress: "In progress", complete: "All bootcampers responded"};

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function kpi(l, v, n){ return '<div class="kpi"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v) + '</div><div class="n">' + esc(n || "") + '</div></div>'; }
function bars(c){
  var max = Math.max.apply(null, c.values.concat([1]));
  var h = '<div class="card"><h3>' + esc(c.title) + '</h3>';
  for (var i = 0; i < c.labels.length; i++){
    h += '<div class="row"><span>' + esc(c.labels[i]) + '</span><div class="bar"><i style="width:' + Math.round(100 * c.values[i] / max) + '%"></i></div><b>' + c.values[i] + '</b></div>';
  }
  return h + '</div>';
}
function render(n, d){
  var pct = d.bootcampers_count ? Math.round(100 * d.responses_count / d.bootcampers_count) : 0;
  var h = '<div class="wrap"><div class="kpis">'
    + kpi("Responses", d.responses_count, "of " + d.bootcampers_count + " bootcampers")
    + kpi("Completion", pct + "%", STATUS[d.status] || "");
  if (d.window) h += kpi("Send window open", d.window.open, d.window.upcoming + " upcoming, " + d.window.closed + " closed");
  (d.numeric || []).forEach(function(x){ h += kpi("Avg: " + x.title, x.average, "n = " + x.n); });
  h += '</div>';
  if (!d.responses_count){
    h += '<div class="empty" style="margin-top:16px">No Survey ' + n + ' responses yet.' + (d.window ? ' ' + d.window.open + ' bootcamper(s) are in their send window right now.' : '') + '</div>';
  } else {
    h += '<div class="grid">' + (d.charts || []).map(function(c){ return bars(c); }).join("") + '</div>';
    if ((d.text_columns || []).length){
      h += '<p style="color:#6b7280;font-size:.85rem;margin-top:14px">Free-text answers collected: ' + d.text_columns.map(function(t){ return esc(t.title) + " (" + t.answers + ")"; }).join(", ") + '</p>';
    }
  }
  document.getElementById("p" + n).innerHTML = h + '</div>';
}
async function load(n){
  var box = document.getElementById("p" + n);
  box.innerHTML = '<div class="wrap"><div class="empty">Loading... the free server can take up to a minute to wake up.</div></div>';
  var data = null, err = "";
  for (var i = 0; i < PATHS.length && !data; i++){
    try {
      var r = await fetch(API + PATHS[i] + n);
      if (r.ok) { data = await r.json(); } else { err = "HTTP " + r.status; }
    } catch (e) { err = e.message; }
  }
  if (!data){
    box.innerHTML = '<div class="wrap"><div class="empty">Could not load Survey ' + n + ' (' + esc(err) + ').</div></div>';
    return;
  }
  cache[n] = data;
  render(n, data);
}
function show(n){
  [1, 2, 3].forEach(function(i){
    document.getElementById("p" + i).classList.toggle("active", i === n);
    document.getElementById("t" + i).classList.toggle("active", i === n);
  });
  if (n > 1 && !cache[n]) load(n);
}
</script>
</body>
</html>
